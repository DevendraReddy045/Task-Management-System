server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Handle SPA routing (always serve index.html for unknown routes)
    location / {
        try_files $uri /index.html;
    }

    # Cache static assets for 1 year (immutable if hashed filenames are used)
    location ~* \.(?:ico|css|js|gif|jpe?g|png|webp|svg|woff2?|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
        try_files $uri /index.html;
    }

    # Don’t cache HTML files (important for SPA updates)
    location ~* \.html?$ {
        expires -1;
        add_header Cache-Control "no-cache";
    }
}
